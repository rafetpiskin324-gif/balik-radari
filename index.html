function score(f,d){const mo=new Date().getMonth()+1,F2={},miss=[];

function chatCtx(){const d=D(),r=REG[S.reg],mo=moon(),inl=!r[3].length;const top=inl?[]:regFish().map(f=>({f,r:score(f,d)})).filter(x=>x.r.F.Mevsim>10).sort((a,b)=>b.r.s-a.r.s).slice(0,5).map(x=>({tur:x.f.n,yontem:x.f.gear.y,uygunluk_yuzde:x.r.ok?Math.round(x.r.s):null,guven:conf(x.r)}));
 return {il:r[0],kiyi_denizleri:r[3].map(x=>SEA[x]),kiyi_ili:!inl,tarih:new Date().toLocaleDateString('tr-TR'),veri:{hava_C:d.at,deniz_C:d.st,ruzgar_kmh:d.ws,ruzgar_yon:d.wd==null?null:dn(d.wd),hamle_kmh:d.gu,dalga_m:d.wh,basinc_hPa:d.pr,nem_yuzde:d.hum,ay_yuzde:mo.il,ay_evre:mo.nm},veri_zamani:d.tw||null,veri_kaynagi:'Open-Meteo (model verisi)',aktivite_tahmini:top}}
function openChat(){$('#chat').classList.add('open');paintChat();setTimeout(()=>{const q=$('#cq');if(q)q.focus()},60)}

async function askChat(t){t=(t||'').trim().slice(0,600);if(!t||S.cbusy)return;S.chat=S.chat||[];S.chat.push({r:'u',t});S.cbusy=true;const q=$('#cq');if(q)q.value='';paintChat();
 try{if(location.protocol=='file:')throw new Error('file');const r=await fetch('/api/asistan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:S.chat.slice(-7,-1).filter(m=>m.r!='a e').map(m=>({role:m.r=='u'?'user':'model',text:m.t})),context:chatCtx()})});const jr=await r.json().catch(()=>({}));if(!r.ok)throw new Error(jr.error||'HTTP '+r.status);S.chat.push({r:'a',t:jr.reply})}
 catch(e){S.chat.push({r:'a e',t:e.message=='file'?'Asistan yalnızca sunucuda (Render) yayınlanan sürümde çalışır.':'Asistana ulaşılamadı: '+(e.message&&e.message.length<160?e.message:'bağlantı hatası').replace(/\.$/,'')+'. Lütfen tekrar deneyin.'})}
 S.cbusy=false;paintChat()}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeChat()});
const slug=s=>fold(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function openRoom(){const el=$('#room');el.classList.add('open');const sel=$('#rsel');if(!sel.options.length)sel.innerHTML='<option value="genel">Genel Sohbet</option>'+REG.map(r=>`<option value="${slug(r[0])}">${r[0]}</option>`).join('');sel.value=S.rm;paintRin();startRoom()}

async function startRoom(){if(ES){ES.close();ES=null}S.rmsg=[];S.rst='connecting';S.rcount=0;paintRoom();const rm=S.rm;
 if(location.protocol=='file:'){S.rst='off';S.roff='Sohbet yalnızca sunucuda (Render) yayınlanan sürümde çalışır.';paintRoom();return}
 try{const r=await fetch('/api/sohbet/mesajlar?oda='+rm);if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(rm!=S.rm)return;S.rmsg=d.mesajlar||[];S.roff='';
  ES=new EventSource('/api/sohbet/akis?oda='+rm);
  ES.onopen=()=>{S.rst='live';paintRoom()};ES.onerror=()=>{S.rst='err';paintRoom()};
  ES.addEventListener('mesaj',e=>{const m=JSON.parse(e.data);if(!S.rmsg.some(x=>x.id==m.id)){S.rmsg.push(m);if(S.rmsg.length>120)S.rmsg.shift()}paintRoom()});
  ES.addEventListener('sil',e=>{const id=JSON.parse(e.data).id;S.rmsg=S.rmsg.filter(x=>x.id!=id);paintRoom()});

 catch(e){S.rst='off';S.roff='Sohbet sunucusuna ulaşılamadı. Bu özellik yalnızca sunucuda yayınlanan sürümde çalışır; internet bağlantınızı kontrol edip tekrar deneyin.'}paintRoom()}
function paintRoom(){const m=$('#rm');if(!m)return;const near=m.scrollHeight-m.scrollTop-m.clientHeight<80;
 $('#rst').textContent={connecting:'Bağlanıyor…',live:(S.rcount||1)+' kişi çevrimiçi',err:'Bağlantı koptu, yeniden bağlanıyor…',off:'Çevrimdışı'}[S.rst]||'';
 let h=`<div class="mu" style="font-size:11px;padding:6px 0">Mesajlar herkese açıktır. Telefon, konum veya kişisel bilgi paylaşmayın; bağlantı paylaşımı kapalıdır. Av yasakları ve ölçüler için resmî kaynakları kontrol edin. Mesajlar sunucuda kısa süre tutulur.</div>`;
 if(S.rst=='off')h+=`<div class="alert"><span class="icw" style="font-size:20px"><i data-lucide="triangle-alert"></i></span><div><b>Sohbete bağlanılamadı</b><p>${esc(S.roff||'')}</p><button class="btn" onclick="startRoom()"><i data-lucide="refresh-cw"></i> Tekrar dene</button></div></div>`;
 else if(!S.rmsg.length&&S.rst=='live')h+='<div class="mu" style="text-align:center;padding:30px 0">Henüz mesaj yok. İlk mesajı sen yaz.</div>';
 h+=S.rmsg.map(x=>{const own=S.own[x.id],t=new Date(x.ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});return `<div class="rb ${own?'o':''}"><div class="rh"><b>${esc(x.n)}</b><span>${t}</span>${own||S.rep[x.id]?'':`<button class="rf" aria-label="Mesajı bildir" title="Mesajı bildir" onclick="reportMsg('${x.id}')"><i data-lucide="flag"></i></button>`}${S.rep[x.id]?'<span>bildirildi</span>':''}</div><div class="rt">${esc(x.t)}</div></div>`}).join('');
 m.innerHTML=h;if(near)m.scrollTop=m.scrollHeight;icons()}
function paintRin(){const el=$('#rin');if(!el)return;const n=lsGet('br_nick');
 el.innerHTML=n?`<input id="rq" placeholder="${esc(n)} olarak yaz…" maxlength="300" onkeydown="if(event.key==='Enter')sendRoom()" autocomplete="off" aria-label="Mesaj"><button class="btn" onclick="sendRoom()" aria-label="Gönder"><i data-lucide="send"></i></button><div id="rer" class="rer"></div>`:`<input id="rn" placeholder="Takma adınız (2-20 karakter)" maxlength="20" onkeydown="if(event.key==='Enter')setNick()" autocomplete="off" aria-label="Takma ad"><button class="btn" onclick="setNick()">Katıl</button><div id="rer" class="rer">Gerçek adınızı yazmak zorunda değilsiniz.</div>`;icons()}

document.addEventListener('keydown',e=>{if(e.key=='Escape')closeRoom()});
function home(){const d=D(),r=REG[S.reg],mo=moon(),sf=safety(d),inl=!r[3].length;
 const val=(x,n,u)=>x==null?'—':(+x).toFixed(n)+u;

 h+=`<div class="qa">${[['map','Harita',"go('map')"],['fish','Balık Rehberi',"go('fish')"],['map-pin','Meralar',"go('spots')"],['message-circle','Sohbet','openRoom()']].map(q=>`<button onclick="${q[2]}"><span>${ic(q[0],22)}</span>${q[1]}</button>`).join('')}</div>`;
 h+=ASK+ROOMCARD;
 if(S.loading)return h+`<div class="tiles">${[1,2,3,4,5,6].map(()=>'<div class="tile"><div class="th">Yükleniyor…</div><div class="tv">&nbsp;</div></div>').join('')}</div>`;
 h+=errBox();if(S.stale)h+=`<div class="alert">${ic('clock',20)}<div><b>Önbellekteki eski veri</b><p>Son güncelleme: ${new Date(S.stale).toLocaleString('tr-TR')}. Bu veri güncel değildir.</p></div></div>`;
 const list=inl?[]:regFish().map(f=>({f,r:score(f,d)})).filter(x=>x.r.F.Mevsim>10).sort((a,b)=>b.r.s-a.r.s);
 if(!inl&&list[0]){const t=list[0],p=t.r.ok?t.r.s:0;h+=`<div class="card feat" role="button" tabindex="0" onclick="openAct('${t.f.n}')"><svg width="78" height="78" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#0a1a30" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${264*p/100} 264" transform="rotate(-90 50 50)"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><text x="50" y="56" text-anchor="middle" fill="#fff" font-size="${t.r.ok?24:12}" font-weight="700">${t.r.ok?Math.round(t.r.s)+'%':'—'}</text></svg><div class="fx"><div class="mu">Bugün öne çıkan tür</div><div class="fname">${t.f.n}</div><div class="mu">${t.f.gear.y} · Güven: ${conf(t.r)}</div><div class="mu" style="font-size:11px;margin-top:2px">${t.r.ok?lvl(t.r.s)+' uygunluk · yakalama olasılığı değildir':'Veri yetersiz'}</div></div>${ic('chevron-right',20)}</div>`}
 h+=`<h2 class="sec">Anlık koşullar</h2><div class="tiles">${tile('thermometer','Hava',fx(d.at,1),'°C','model')}${tile('waves','Deniz suyu',fx(d.st,1),'°C','model tahmini',inl&&'Kıyı ili değil')}${tile('wind','Rüzgâr',fx(d.ws),'km/s',`${dn(d.wd)} · hamle ${d.gu==null?'—':Math.round(d.gu)}`)}${tile('audio-waveform','Dalga',fx(d.wh,1),'m',d.wp==null?'':'periyot '+d.wp.toFixed(1)+' sn',inl&&'Kıyı ili değil')}${tile('gauge','Basınç',fx(d.pr),'hPa',d.dp==null?'':'3 sa '+(d.dp>0?'+':'')+d.dp.toFixed(1))}${tile('droplets','Nem',d.hum==null?null:d.hum,'%',d.rain==null?'':'yağış '+d.rain+' mm')}${tile('moon','Ay',mo.il,'%',mo.nm)}${tile('arrow-up-down','Deniz seviyesi',fx(d.sl,2),'m',d.sl==null?'':'model',inl&&'Kıyı ili değil')}${tile('sunrise','Gün doğumu',d.sr?d.sr.slice(11):null,'',d.ss?'batım '+d.ss.slice(11):'')}${tile('compass','Akıntı',fx(d.cv,1),'km/s','model',inl&&'Kıyı ili değil')}</div>`;
 if(inl)return h+`<div class="info">${ic('info',22)}<div><b>Kıyısı olmayan il</b><div class="mu">Deniz suyu, dalga, deniz seviyesi ve akıntı verisi ile deniz balığı önerisi bu il için gösterilmez. Tatlı su av bilgisi için yerel göl/nehir verisi henüz yok.</div></div></div><details class="card"><summary style="cursor:pointer">Veri kaynakları</summary><div style="margin-top:8px">${src(d)}</div></details>`;
 h+=`<div class="info ${sf.c=='g'?'':sf.c}">${ic(sf.c=='r'?'octagon-alert':sf.c=='o'?'triangle-alert':'shield-check',22)}<div><b>Güvenlik: ${sf.t}</b><div class="mu">${sf.x}</div><div class="mu" style="margin-top:4px">Resmî MGM uyarıları henüz entegre değil; çıkmadan önce mgm.gov.tr’yi kontrol edin.</div></div></div>`;
 h+=`<div class="card"><h3>${ic('fish',18)} Günün av raporu</h3><div class="mu" style="margin-bottom:4px">Koşul uygunluk göstergesidir; yakalama olasılığı değildir. Av kaydı verisi henüz yok.</div>`;
 if(!list.length)h+='<p class="mu">Bu bölge ve mevsim için aktif tür bulunamadı.</p>';
